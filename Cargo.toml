[package]
name = "trustsweep"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Find CA bundles inside venvs, node_modules, wheels, jars, container image layers and binaries that still trust a revoked CA (eMudhra 2026), and the package to upgrade"
license = "MIT"
repository = "https://github.com/majiayu000/trustsweep"
homepage = "https://github.com/majiayu000/trustsweep"
readme = "README.md"
keywords = ["ca-bundle", "certificates", "x509", "supply-chain", "security"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
exclude = ["examples/*", "docs/*.png"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.10"
globset = "0.4.20"
hex = "0.4.3"
memchr = "2.8.3"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = "3.5.0"
walkdir = "2.5.0"
x509-parser = "0.18.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = "0.14.10"
